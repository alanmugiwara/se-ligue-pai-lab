global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "put-your-server-hostame"
    static_configs:
      - targets:
          - "put-your-server-ip:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "put-your-server-ip:8080"

  - job_name: "navidrome"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "put-your-server-ip:4533"