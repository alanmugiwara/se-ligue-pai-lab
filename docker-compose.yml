services:
  postgres: # db zabbix
    image: postgres:16-alpine3.18
    container_name: db-zabbix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: # named
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    mem_limit: 400m
    restart: unless-stopped
  
  zabbix-server: # back zabbix
    image: zabbix/zabbix-server-pgsql:alpine-6.0-latest
    container_name: back-zabbix-server
    depends_on:
      - postgres
    environment:
      DB_SERVER_HOST: ${DB_SERVER_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${HOST_ZABBIX_PORT}:${CONTAINER_ZABBIX_PORT}"
    networks:
      - zabbix-net
    mem_limit: 256m
    restart: unless-stopped

  zabbix-web: # front zabbix
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.0-latest
    container_name: front-zabbix-web
    depends_on:
      - postgres
      - zabbix-server
    environment:
      DB_SERVER_HOST: ${DB_SERVER_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${PHP_TZ}
    ports:
      - "${HOST_PHP_PORT}:${CONTAINER_PHP_PORT}"
    networks:
      - zabbix-net
    mem_limit: 150m
    restart: unless-stopped
  
  prometheus:
    image: prom/prometheus:v3.13.1-distroless
    container_name: prometheus
    volumes: # bind
     - ./src/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'
    networks:
      - zabbix-net
    mem_limit: 100m
    restart: unless-stopped
    
volumes:
  postgres_data:

networks:
  zabbix-net: